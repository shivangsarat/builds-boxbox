name: Verify public blog
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-public.yml']
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify anonymous homepage, articles and discovery files
        run: |
          python - <<'PY'
          import urllib.request, time, re, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          base = 'https://shivangsarat.github.io/builds-boxbox/'
          articles = {
              'articles/building-my-own-f1-pit-wall/': 'Building my own Formula 1 pit wall',
              'articles/testing-a-race-without-a-live-race/': 'Testing a race without a live race',
              'articles/four-screens-one-upstream-budget/': 'Four screens, one upstream budget',
              'articles/the-race-moves-on/': 'The race moves on',
          }
          def fetch(path):
              url=base+path
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BoxBox public verification'}),timeout=15) as r:
                          assert r.status==200 and r.url==url, (r.status,r.url)
                          data=r.read(5000000)
                      print('HTTP 200',url,len(data),'bytes',flush=True)
                      return data
                  except Exception:
                      if attempt==3: raise
                      time.sleep(5)
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical=[];self.images=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='canonical': self.canonical.append(a.get('href'))
                  if tag=='img': self.images.append(a.get('src'))
          from urllib.parse import urljoin
          images=set()
          for path, title in {'':'BoxBox Builds',**articles}.items():
              html=fetch(path).decode('utf-8')
              assert title.lower() in html.lower(),title
              p=Page();p.feed(html)
              assert p.canonical==[base+path], (path,p.canonical)
              for img in p.images:
                  u=urljoin(base+path,img)
                  if u.startswith(base):images.add(u[len(base):])
          for path in sorted(images):
              assert fetch(path).startswith(b'\x89PNG\r\n\x1a\n')
          for path in ['rss.xml','sitemap.xml']:
              xml=fetch(path);ET.fromstring(xml)
              for slug in articles: assert (base+slug).encode() in xml,(path,slug)
          print('ALL PUBLIC URL CHECKS PASSED',flush=True)
          PY
